<!--
  Jamdung Quiz on the TV: the clue card, the answer boxes and the letters big enough for the whole room, while the
  player taps on the phone or tablet (js/tv.js sends what's on screen; this page only shows it). The same page is
  used everywhere:
   - Android app with a TV on an HDMI cable, Smart View / Screen cast or another wireless display: the app shows this
     page on the TV and calls tvState() (TvScreens.java)
   - Chromecast / Google TV: a self-contained copy (tools/tv_page.py) is the Cast receiver, hosted on the web and
     registered as https://<your site>/tv.html?cast=1; the app sends on urn:x-cast:com.realisticworks.jamdungquiz
   - a browser: the game opens it as a window ("Open TV screen")
  The fixes from Jamdung Charades' TV screen: a 1920 x 1080 stage scaled into the TV-safe area (?safe=70..100),
  measured four ways because some Cast TVs report twice their size, re-fitted every 2 seconds, and no color-mix, :has
  or other new CSS, for Chromecast's older browsers.
-->

:root {
  --bg: #070806; --cream: #f6f2e6; --ink-2: rgba(246,242,230,.74); --muted: #9aa192; --gold: #f7c63d; --gold-hi: #f9d777; --gold-lo: #caa232;
  --green: #17b86a; --green-hi: #5dcd97; --green-lo: #139757; --red: #f0484e; --red-hi: #f57f83; --red-lo: #c53b40; --btn-ink: #140f04;
  --line: rgba(246,242,230,.1); --line2: rgba(246,242,230,.18); --glass: rgba(19,23,17,.74);
  --display: 'Unbounded', 'Plus Jakarta Sans', system-ui, sans-serif; --font: 'Plus Jakarta Sans', system-ui, sans-serif;
  --ease: cubic-bezier(.2,.8,.2,1);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; color: var(--cream); font-family: var(--font); -webkit-font-smoothing: antialiased; cursor: none; }
/* the glow fills the whole screen, so the TV-safe border around the stage doesn't show an edge */
body { background: radial-gradient(52vw 70vh at 8% 0%, rgba(247,198,61,.18), rgba(247,198,61,0) 70%), radial-gradient(57vw 76vh at 96% 104%, rgba(23,184,106,.15), rgba(23,184,106,0) 70%), var(--bg); }
/* everything is laid out on a 1920 x 1080 stage, scaled to fit inside the TV-safe area (see fit()) */
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
.top { position: absolute; left: 72px; right: 72px; top: 44px; height: 92px; display: flex; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; flex: none; }
.mark { width: 70px; height: 70px; border-radius: 20px; overflow: hidden; flex: none; box-shadow: 0 12px 32px -12px rgba(0,0,0,.7); margin-right: 22px; }
.mark svg { width: 100%; height: 100%; display: block; }
.logo { font: 800 46px/1 var(--display); letter-spacing: -.02em; white-space: nowrap; }
.logo small { font: 700 26px/1 var(--font); color: var(--gold); margin-left: 16px; letter-spacing: .04em; }
.chips { display: flex; align-items: center; justify-content: flex-end; min-width: 0; }
.chip { display: inline-flex; align-items: center; height: 70px; padding: 0 30px; margin-left: 16px; border-radius: 999px; background: var(--glass); border: 2px solid var(--line);
  font-weight: 800; font-size: 28px; letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; }
.chip img { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; margin: 0 14px 0 -16px; }
.chip .lab { color: var(--muted); margin-right: 12px; }
.chip.t-hard { color: #ff9a9d; border-color: rgba(240,72,78,.55); }
.chip.t-super { color: #fff; background: linear-gradient(150deg, var(--red), var(--red-lo)); border-color: rgba(255,170,172,.5); }
.chip.t-bonus { color: var(--gold); border-color: rgba(247,198,61,.5); }
.chip.gold { color: var(--btn-ink); background: linear-gradient(150deg, var(--gold-hi), var(--gold)); border-color: transparent; }
.chip b { font-family: var(--display); font-size: 34px; margin-left: 12px; color: var(--gold); letter-spacing: 0; }
.chip.gold b { color: var(--btn-ink); }
#view { position: absolute; left: 72px; right: 72px; top: 170px; bottom: 56px; }
.center { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
/* #view makes the gap outrank the margin: 0 on .hint, .huge and .endscore below (else those touched what's above them) */
#view .center > * + * { margin-top: 30px; }
.eyebrow { font-weight: 800; font-size: 30px; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); }
.hint { font-size: 38px; font-weight: 600; color: var(--muted); margin: 0; max-width: 1400px; line-height: 1.35; }
.hint b { color: var(--cream); }
.huge { font: 800 150px/1 var(--display); letter-spacing: -.04em; margin: 0; }
.bigmark { width: 190px; height: 190px; border-radius: 52px; overflow: hidden; box-shadow: 0 30px 80px -20px rgba(247,198,61,.45); animation: float 4s ease-in-out infinite; }
.bigmark svg { width: 100%; height: 100%; display: block; }
.rasta { width: 170px; height: 9px; border-radius: 9px; background: linear-gradient(90deg, var(--red) 0 33.33%, var(--gold) 33.33% 66.66%, var(--green) 66.66%); }
.dots i { display: inline-block; width: 20px; height: 20px; margin: 0 9px; border-radius: 50%; background: var(--gold); animation: blink 1.4s infinite both; }
.dots i:nth-child(1) { background: var(--red); } .dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { background: var(--green); animation-delay: .4s; }
.stats { display: flex; justify-content: center; }
.stat { min-width: 340px; margin: 0 14px; padding: 26px 40px; border-radius: 34px; background: var(--glass); border: 2px solid var(--line); }
.stat b { display: block; font: 800 84px/1 var(--display); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.stat span { display: block; margin-top: 10px; font-weight: 800; font-size: 26px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
.stat .gold { color: var(--gold); }

/* ---- a level: the clue card on top, the boxes and letters under it. The three make one block, scaled as one to fill
   the screen (fitLevel()): a short level shows big, a long one still fits. ---- */
.level { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.level.anim { transition: transform .45s var(--ease); }
.card { position: relative; display: flex; align-items: center; padding: 40px 48px 40px 40px; border-radius: 48px; overflow: hidden;
  background: radial-gradient(75% 42% at 50% 0%, rgba(247,198,61,.3), rgba(0,0,0,0) 100%), linear-gradient(180deg, rgba(27,32,24,.94), rgba(13,16,11,.96));
  box-shadow: inset 0 0 0 2px var(--line), 0 50px 100px -50px rgba(0,0,0,.9); }
.card.t-hard { box-shadow: inset 0 0 0 3px rgba(240,72,78,.6), 0 50px 100px -50px rgba(0,0,0,.9); }
.card.t-super { box-shadow: inset 0 0 0 4px rgba(240,72,78,.85), inset 0 0 90px -30px rgba(240,72,78,.5), 0 50px 100px -50px rgba(0,0,0,.9); }
.card.t-bonus { box-shadow: inset 0 0 0 3px rgba(247,198,61,.55), 0 50px 100px -50px rgba(0,0,0,.9); }
.card.won { box-shadow: inset 0 0 0 4px var(--gold), 0 0 80px rgba(247,198,61,.35); }
/* --cf is the clue size. The clues are what a room (or a TV audience) reads first, so they're big and bold, and the
   letters under them smaller: those are for whoever's tapping. The whole block is scaled to fit, so it stays put. */
.card { --cf: 50px; }
/* the topic's picture and name on the left of the card, the clues on the right */
.side { flex: none; display: flex; flex-direction: column; align-items: center; margin-right: 40px; }
.card .emblem { width: 168px; height: 168px; }
.side .kchip { margin: 22px 0 0; padding: 10px 22px; font-size: 24px; letter-spacing: .14em; }
.card-in { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.emblem { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; flex: none; box-shadow: 0 0 0 5px rgba(247,198,61,.85), 0 20px 50px -16px rgba(0,0,0,.8); background: #1b2018; }
.kchip { margin-left: 26px; padding: 14px 28px; border-radius: 999px; font-weight: 800; font-size: 30px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); border: 2px solid rgba(247,198,61,.45); }
.clues { list-style: none; margin: 0; padding: 0; width: 100%; counter-reset: clue; }
.clue { position: relative; margin-top: calc(var(--cf) * .36); padding: calc(var(--cf) * .5) 34px calc(var(--cf) * .5) 112px; border-radius: 28px; font-size: var(--cf); font-weight: 700; line-height: 1.25; text-align: left;
  color: #fffaf0; background: rgba(246,242,230,.07); box-shadow: inset 0 0 0 2px var(--line2); counter-increment: clue; animation: rise .5s var(--ease) both;
  text-wrap: balance; /* two even lines, not a word on its own (newer TVs; older ones ignore it) */ }
.clue::before { content: counter(clue); position: absolute; left: 28px; top: 50%; width: 60px; height: 60px; margin-top: -30px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; font: 700 30px/1 var(--display); color: var(--btn-ink); background: var(--gold); }
.clue.more { padding-left: 34px; text-align: center; font: 700 calc(var(--cf) * .6)/1.2 var(--display); color: var(--gold); background: rgba(247,198,61,.06); box-shadow: none; border: 3px dashed rgba(247,198,61,.45); animation: none; }
.clue.more::before { display: none; }
.clue:first-child { margin-top: 0; }
.card .answer { margin-top: calc(var(--cf) * .7); font: 800 calc(var(--cf) * 1.8)/1.05 var(--display); letter-spacing: -.03em; color: var(--gold); text-align: center; animation: pop .7s var(--ease) both; }
.play { display: flex; flex-direction: column; align-items: center; margin-top: 36px; }
.slots { display: flex; flex-wrap: wrap; justify-content: center; align-content: center; width: 100%; }
.word { display: flex; flex: none; margin: 0 calc(var(--s) * .2) calc(var(--s) * .32); }
.slot { width: var(--s); height: calc(var(--s) * 1.15); margin: 0 calc(var(--s) * .055); border-radius: calc(var(--s) * .26); display: grid; place-items: center;
  font: 700 calc(var(--s) * .52)/1 var(--display); background: rgba(246,242,230,.05); box-shadow: inset 0 0 0 3px rgba(246,242,230,.28), inset 0 5px 10px rgba(0,0,0,.35); }
.slot.f { color: var(--btn-ink); background: linear-gradient(180deg, #fffdf6, #e9e1c8); box-shadow: 0 7px 0 #a99d78, 0 14px 22px -10px rgba(0,0,0,.6); animation: pop .25s cubic-bezier(.3,1.8,.5,1); }
.slot.l { color: var(--btn-ink); background: linear-gradient(180deg, var(--gold-hi), var(--gold) 55%, var(--gold-lo)); box-shadow: 0 7px 0 #9c7a1f, 0 0 26px rgba(247,198,61,.45); }
.slot.r { color: var(--btn-ink); background: linear-gradient(180deg, var(--green-hi), var(--green) 55%, var(--green-lo)); box-shadow: 0 7px 0 #0c6b3c, 0 0 30px rgba(23,184,106,.55); animation: wave .6s calc(var(--i) * 60ms) cubic-bezier(.3,1.6,.5,1) both; }
.slots.bad .slot.f { color: #fff; background: linear-gradient(180deg, var(--red-hi), var(--red) 55%, var(--red-lo)); box-shadow: 0 7px 0 #8f2328; }
.slots.bad { animation: shake .5s; }
.punct { align-self: flex-end; width: calc(var(--s) * .32); text-align: center; font: 700 calc(var(--s) * .62)/1 var(--display); color: var(--ink-2); }
.punct.hi { align-self: flex-start; }
.punct.mid { align-self: center; }
/* its width (whole keys of 90px a row, rows evenly filled) is set by layoutAt() */
.tray { display: flex; flex-wrap: wrap; justify-content: center; margin-top: 28px; }
.key { width: 80px; height: 88px; margin: 0 5px 12px; border-radius: 18px; display: grid; place-items: center; font: 700 40px/1 var(--display); color: var(--btn-ink);
  background: linear-gradient(180deg, #fffdf6 0%, #f3edda 60%, #e4dbbf 100%); box-shadow: 0 6px 0 #a99d78, 0 14px 20px -10px rgba(0,0,0,.8); transition: opacity .3s, background .2s; }
.key.u { color: transparent; background: rgba(0,0,0,.3); box-shadow: inset 0 0 0 2px var(--line); }
.key.x { visibility: hidden; }
.won-box { margin-top: 40px; text-align: center; }
.won-box .eyebrow { font-size: 34px; }
.bigstars { display: flex; justify-content: center; align-items: flex-end; margin-top: 18px; }
.bigstars svg { width: 120px; height: 120px; margin: 0 8px; color: rgba(246,242,230,.12); animation: starIn .6s var(--d) cubic-bezier(.2,1.8,.4,1) both; }
.bigstars svg:nth-child(2) { width: 150px; height: 150px; }
.bigstars svg.on { color: var(--gold); filter: drop-shadow(0 0 22px rgba(247,198,61,.6)); }

/* ---- Blitz and the Bonus round ---- */
.blitz { height: 100%; display: flex; flex-direction: column; }
.timerrow { display: flex; align-items: center; flex: none; height: 90px; }
.bar { flex: 1; height: 30px; border-radius: 999px; overflow: hidden; background: rgba(246,242,230,.08); box-shadow: inset 0 0 0 2px var(--line); }
.bar i { display: block; height: 100%; border-radius: inherit; transform-origin: left center; background: linear-gradient(90deg, var(--green), var(--gold)); box-shadow: 0 0 22px rgba(247,198,61,.45); }
.bar.low i { background: linear-gradient(90deg, var(--red), #ff9f45); }
.bonusmode .bar i { background: linear-gradient(90deg, var(--gold), var(--red-hi)); }
.secs { width: 170px; text-align: right; font: 800 76px/1 var(--display); font-variant-numeric: tabular-nums; }
.secs.low { color: var(--red-hi); animation: beat 1s infinite; }
.qcard { position: relative; flex: 1; min-height: 0; margin-top: 22px; padding: 30px 60px; border-radius: 44px; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  background: radial-gradient(75% 50% at 50% 0%, rgba(247,198,61,.26), rgba(0,0,0,0) 100%), linear-gradient(180deg, rgba(27,32,24,.94), rgba(13,16,11,.96)); box-shadow: inset 0 0 0 2px var(--line); }
.bonusmode .qcard { box-shadow: inset 0 0 0 4px rgba(247,198,61,.8), 0 0 60px rgba(247,198,61,.2); }
.qcard .emblem { width: 120px; height: 120px; }
.qcard .ready-tag { font-size: 44px; }
.qcard.counting .ready-tag { position: absolute; left: 0; right: 0; top: 56px; }
.qtext { margin: 26px 0 0; font: 700 60px/1.2 var(--display); letter-spacing: -.02em; max-width: 1600px; }
.opts { flex: none; display: flex; flex-wrap: wrap; justify-content: space-between; margin-top: 26px; }
.opt { width: 878px; height: 132px; margin-top: 18px; padding: 0 30px; border-radius: 999px; display: flex; align-items: center; justify-content: center; text-align: center;
  font: 700 46px/1.1 var(--display); background: rgba(246,242,230,.08); box-shadow: inset 0 0 0 3px rgba(246,242,230,.26); }
.opt.ok { color: var(--btn-ink); background: linear-gradient(180deg, var(--green-hi), var(--green) 46%, var(--green-lo)); box-shadow: 0 0 40px rgba(23,184,106,.55); animation: pop .4s var(--ease); }
.opt.no { color: #fff; background: linear-gradient(180deg, var(--red-hi), var(--red) 46%, var(--red-lo)); animation: shake .45s; }
.count { position: absolute; left: 0; right: 0; top: 0; bottom: 0; z-index: 4; display: grid; place-items: center; font: 800 420px/1 var(--display); color: var(--gold);
  text-shadow: 0 0 90px rgba(247,198,61,.55), 0 30px 80px rgba(0,0,0,.6); animation: pop .6s var(--ease); pointer-events: none; }
.endscore { font: 800 300px/.9 var(--display); letter-spacing: -.05em; margin: 0; color: var(--gold); text-shadow: 0 0 80px rgba(247,198,61,.35); animation: pop .7s var(--ease) both; }
.gempill { display: inline-flex; align-items: center; padding: 18px 44px; border-radius: 999px; font: 800 64px/1 var(--display); background: rgba(23,184,106,.14); border: 3px solid rgba(23,184,106,.5); }
.gempill svg { width: 72px; height: 72px; margin-left: 16px; }

/* ---- the Bonus round's casino intro and marquee lights ---- */
/* the marquee bulbs round the edge of the TV picture, in the Bonus round */
.lights { position: absolute; left: 16px; right: 16px; top: 16px; bottom: 16px; border-radius: 40px; pointer-events: none; z-index: 5; }
.lights::before, .lights::after { content: ''; position: absolute; left: 0; right: 0; top: 0; bottom: 0;
  background:
    radial-gradient(circle, #fff7d1 0, #fff7d1 6px, rgba(255,205,80,.7) 8px, rgba(255,205,80,0) 15px) 0 0 / 48px 30px repeat-x,
    radial-gradient(circle, #fff7d1 0, #fff7d1 6px, rgba(255,205,80,.7) 8px, rgba(255,205,80,0) 15px) 0 100% / 48px 30px repeat-x,
    radial-gradient(circle, #fff7d1 0, #fff7d1 6px, rgba(255,205,80,.7) 8px, rgba(255,205,80,0) 15px) 0 0 / 30px 48px repeat-y,
    radial-gradient(circle, #fff7d1 0, #fff7d1 6px, rgba(255,205,80,.7) 8px, rgba(255,205,80,0) 15px) 100% 0 / 30px 48px repeat-y;
  animation: bulbs .5s steps(1) infinite; }
.lights::after { background-position: 24px 0, 24px 100%, 0 24px, 100% 24px; animation-delay: .25s; }
.lights.fast::before, .lights.fast::after { animation-duration: .22s; }
.casino { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.reels { display: flex; justify-content: center; padding: 22px; border-radius: 40px; background: linear-gradient(180deg, #0d0303, #2a0a0b); box-shadow: inset 0 0 0 4px rgba(247,198,61,.75), inset 0 16px 36px rgba(0,0,0,.6), 0 0 80px rgba(247,198,61,.25); }
.reel { --h: 230px; position: relative; width: 210px; height: var(--h); margin: 0 11px; overflow: hidden; border-radius: 30px; background: linear-gradient(180deg, #cfc6ad 0%, #fffaf0 30%, #fffaf0 70%, #cfc6ad 100%); box-shadow: inset 0 0 0 4px #b8860b; }
.reel::after { content: ''; position: absolute; left: 0; right: 0; top: 0; bottom: 0; border-radius: inherit; box-shadow: inset 0 26px 30px -16px rgba(0,0,0,.55), inset 0 -26px 30px -16px rgba(0,0,0,.55); }
.strip { transform: translateY(calc(var(--n) * var(--h) * -1)); animation: reelSpin .9s var(--d) cubic-bezier(.15,.6,.3,1.08) both; }
.sym { height: var(--h); display: grid; place-items: center; }
.sym svg { width: 130px; height: 130px; }
.casino.landed .reel { animation: reelWin .5s ease-in-out 3; }
.btitle { margin: 34px 0 10px; font: 800 150px/.92 var(--display); text-transform: uppercase; color: var(--gold);
  background: linear-gradient(180deg, #fff6c8 0%, #f7c63d 45%, #c8860f 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 8px 0 #6b1a10) drop-shadow(0 0 40px rgba(247,198,61,.5)); opacity: .18; transform: scale(.86); }
.casino.landed .btitle { opacity: 1; transform: none; animation: titleSlam .7s cubic-bezier(.2,1.7,.4,1) both; }
.ctext { margin: 10px 0 0; font-size: 44px; font-weight: 700; color: #f6e7c8; }
.ctext b { color: var(--gold); }
body.casino-bg { background: radial-gradient(70vw 70vh at 50% 45%, rgba(122,29,20,.7), rgba(7,8,6,1) 75%); }

#fx { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none; z-index: 6; }
@keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }
@keyframes pop { 0% { transform: scale(.6); opacity: 0; } 60% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); } }
@keyframes rise { from { transform: translateY(30px); opacity: 0; } }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
@keyframes wave { 0% { transform: translateY(0); } 40% { transform: translateY(-26px) scale(1.1); } 100% { transform: translateY(0); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-22px); } 40% { transform: translateX(18px); } 60% { transform: translateX(-12px); } 80% { transform: translateX(8px); } }
@keyframes beat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.08); } }
@keyframes starIn { from { opacity: 0; transform: scale(0) rotate(-90deg); } to { opacity: 1; transform: none; } }
@keyframes bulbs { 0% { opacity: 1; } 50% { opacity: .2; } }
@keyframes reelSpin { from { transform: translateY(0); } }
@keyframes reelWin { 50% { box-shadow: inset 0 0 0 6px #fff3b0, 0 0 50px rgba(247,198,61,.9); } }
@keyframes titleSlam { 0% { opacity: 0; transform: scale(1.9); } 60% { opacity: 1; transform: scale(.94); } 100% { opacity: 1; transform: none; } }
</style>

<script>
'use strict';
var $ = function (s) { return document.querySelector(s); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
var MARK = $('#mark').innerHTML;
var IC = {
  star: '<svg viewBox="0 0 24 24"><path d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.4L12 17.4l-5.8 3 1.1-6.4-4.7-4.6 6.5-.9z" fill="currentColor"/></svg>',
  bolt: '<svg viewBox="0 0 24 24"><path d="M13.5 2.5 4.8 13.6h6.4l-1 7.9 8.9-11.3h-6.5z" fill="#f2b51d"/></svg>',
  gem: '<svg viewBox="0 0 24 24"><defs><linearGradient id="tvgem" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d4ffe8"/><stop offset=".45" stop-color="#2fd383"/><stop offset="1" stop-color="#0b7a45"/></linearGradient></defs><path d="M7.2 3.5h9.6L21 9.2 12 20.8 3 9.2z" fill="url(#tvgem)" stroke="#fff" stroke-opacity=".95" stroke-width="1.3" stroke-linejoin="round"/><path d="M3 9.2h18M7.2 3.5 9.6 9.2 12 3.5l2.4 5.7 2.4-5.7M9.6 9.2 12 20.8l2.4-11.6" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width=".9" stroke-linejoin="round"/></svg>',
  gift: '<svg viewBox="0 0 24 24" fill="none" stroke="#f0484e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="9" width="17" height="4" rx="1.5"/><path d="M5 13v6.5A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5V13M12 9v12"/></svg>',
  flame: '<svg viewBox="0 0 24 24"><path d="M12 21.5c-3.9 0-6.8-2.7-6.8-6.4 0-3.3 2.3-5.4 3.6-7.6.5 1.6 1.4 2.6 2.4 3 .1-3.3 1.7-6 4.1-7.9-.3 2.6.6 4.6 2 6.6 1.1 1.6 1.7 3.4 1.7 5.6 0 3.9-3 6.7-7 6.7z" fill="#ff7a2f"/></svg>',
  trophy: '<svg viewBox="0 0 24 24" fill="none" stroke="#c8941a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 4h9v5.5a4.5 4.5 0 0 1-9 0z"/><path d="M7.5 6H4.5a3 3 0 0 0 3.2 4M16.5 6h3a3 3 0 0 1-3.2 4M12 14v3.5M8.5 20.5h7M9.5 17.5h5"/></svg>'
};
var commas = function (n) { return String(n | 0).replace(/\B(?=(\d{3})+(?!\d))/g, ','); };

// ---------- fitting the 1920 x 1080 stage to the TV ----------
// Many TVs zoom the picture ("overscan") and cut 3-5% off every edge, so the stage uses the middle 90% by default.
// ?safe=100 uses the full screen (TVs set to Just Scan / Screen fit), ?safe=85 leaves more room; anything 70 to 100.
var SAFE = (function () { var m = /[?&]safe=(\d{2,3})/.exec(location.search), v = m ? +m[1] : 90; return Math.max(70, Math.min(100, v)) / 100; })();
// Some Cast TVs report a window about twice the size that's really on screen (a JVC TV with built-in Chromecast did),
// and no resize event follows. So read every measurement the browser offers, trust the smallest, and check again on
// every update from the phone and every 2 seconds. The screen's own size counts only when it has the window's shape:
// a TV screen shown by a phone might report the phone's upright screen, which would shrink the picture to a sliver.
function screenSize() {
  var de = document.documentElement, vv = window.visualViewport, ok = function (x) { return x > 100; };
  var ws = [innerWidth, de && de.clientWidth, vv && vv.width].filter(ok), hs = [innerHeight, de && de.clientHeight, vv && vv.height].filter(ok);
  var w = ws.length ? Math.min.apply(null, ws) : 0, h = hs.length ? Math.min.apply(null, hs) : 0;
  var sw = window.screen ? screen.width : 0, sh = window.screen ? screen.height : 0;
  if (ok(sw) && ok(sh)) {
    if (!w || !h) { w = sw; h = sh; }
    else if (Math.abs(sw / sh / (w / h) - 1) < 0.2) { w = Math.min(w, sw); h = Math.min(h, sh); }
  }
  return { w: w || 1920, h: h || 1080 };
}
var fitKey = '';
function fit() {
  var st = $('#stage'), z = screenSize(), k = Math.min(z.w / 1920, z.h / 1080) * SAFE, key = z.w + 'x' + z.h;
  if (key !== fitKey) { fitKey = key; st.style.transform = 'scale(' + k + ')'; st.style.left = (z.w - 1920 * k) / 2 + 'px'; st.style.top = (z.h - 1080 * k) / 2 + 'px'; }
  $('#size').textContent = Math.round(innerWidth) + '×' + Math.round(innerHeight) + ' · ' + (window.visualViewport ? Math.round(visualViewport.width) + '×' + Math.round(visualViewport.height) : '-') +
    ' · ' + screen.width + '×' + screen.height + ' · ' + (window.devicePixelRatio || 1) + ' → ' + key;
}
addEventListener('resize', fit); addEventListener('load', fit); if (window.visualViewport) visualViewport.addEventListener('resize', fit);
setInterval(fit, 2000); fit();

// A world's picture: embedded in the hosted copy (window.TV_PICS, tools/tv_page.py), else the file next to this page.
function picture(kind, pic) {
  var p = window.TV_PICS && window.TV_PICS[kind];
  if (p) return p;
  return typeof pic === 'string' && /^img\/[\w\/.-]+$/.test(pic) ? pic : '';
}
function emblem(kind, pic) {
  var src = picture(kind, pic);
  return src ? '<img class="emblem" alt="" src="' + esc(src) + '" onerror="noPic(this, 1)">' : '<span class="emblem">' + MARK + '</span>';
}
// A picture that won't load (a world added later that the online copy doesn't have): the Jamdung mark, or nothing.
window.noPic = function (img, mark) {
  if (!mark) { img.remove(); return; }
  var s = document.createElement('span');
  s.className = 'emblem';
  s.innerHTML = MARK;
  if (img.parentNode) img.parentNode.replaceChild(s, img);
};

// ---------- showing a state from the game ----------
var S = null, shown = '', levelKey = '', blitzKey = '', blitzBonus = false, T = { endAt: 0, ms: 0, total: 60000, paused: true };
function take(d) {
  if (typeof d === 'string') { try { d = JSON.parse(d); } catch (e) { return; } }
  if (!d || typeof d !== 'object' || d.v !== 1 || typeof d.s !== 'string') return;
  var prev = S;
  S = d;
  fit();
  $('#size').hidden = d.s !== 'menu';
  document.body.classList.toggle('casino-bg', d.s === 'bonusIntro');
  $('#lights').hidden = !(d.s === 'bonusIntro' || (d.bonus && (d.s === 'blitz' || d.s === 'blitzEnd')));
  $('#lights').classList.toggle('fast', false);
  if (d.s === 'level') level(d, prev);
  else if (d.s === 'blitz') blitz(d);
  else if (d.s === 'blitzEnd') blitzEnd(d);
  else if (d.s === 'bonusIntro') bonusIntro(d);
  else if (d.s === 'menu') menu(d);
  else waiting();
}
window.tvState = take;

function setChips(html) { $('#chips').innerHTML = html; }
function screenIs(name) { var was = shown; shown = name; return was === name; }

function waiting() {
  screenIs('waiting');
  setChips('');
  $('#size').hidden = false;
  $('#view').innerHTML = '<div class="center"><div class="bigmark">' + MARK + '</div><div class="rasta"></div>' +
    '<p class="huge" style="font-size:96px">Jamdung Quiz</p><div class="dots"><i></i><i></i><i></i></div>' +
    '<p class="hint">Open <b>Jamdung - Jamaica Quiz</b> on your phone or tablet and start a level.<br>Everybody shouts the answer!</p></div>';
}

function menu(d) {
  screenIs('menu');
  setChips('');
  $('#view').innerHTML = '<div class="center"><div class="bigmark">' + MARK + '</div><div class="eyebrow">How well do you know Jamaica?</div>' +
    '<div class="stats"><div class="stat"><b>' + commas(d.solved) + '</b><span>of ' + commas(d.total) + ' solved</span></div>' +
    '<div class="stat"><b class="gold">' + commas(d.stars) + '</b><span>stars</span></div></div>' +
    '<p class="hint">Pick a level on your phone. <b>Everybody can shout the answer!</b></p></div>';
}

// How many lines the answer boxes take at box size s in width W, words kept whole (99: a word doesn't fit at all).
// A word is its boxes (1.11 s each, punctuation .32 s) and .4 s of space; a line is 1.47 s tall.
function boxLines(words, s, W) {
  var lines = 1, x = 0;
  for (var i = 0; i < words.length; i++) {
    var w = s * .4;
    for (var j = 0; j < words[i].length; j++) w += String(words[i][j]).charAt(0) === 'P' ? s * .32 : s * 1.11;
    if (w > W) return 99;
    if (x + w > W) { lines++; x = 0; }
    x += w;
  }
  return lines;
}
// The answer boxes: as big as the keys if they fit, on as few lines as will do (one line unless the boxes would get
// small, at most three).
function boxSize(words, W) {
  var plan = [[1, 80], [2, 70], [3, 40]];
  for (var p = 0; p < plan.length; p++) {
    for (var s = 108; s >= plan[p][1]; s -= 2) if (boxLines(words, s, W) <= plan[p][0]) return s;
  }
  return 40;
}

function slotsHtml(d) {
  var i = 0, html = '';
  (d.words || []).forEach(function (word) {
    html += '<div class="word">';
    word.forEach(function (c) {
      c = String(c);
      if (c.charAt(0) === 'P') {
        var ch = c.slice(1), at = /^['’"“”`]$/.test(ch) ? ' hi' : /^[-–—&\/+:]$/.test(ch) ? ' mid' : '';
        html += '<span class="punct' + at + '">' + esc(ch) + '</span>';
        return;
      }
      var cls = d.solved ? 'r' : c === '_' ? '' : c.charAt(0) === 'L' ? 'l' : 'f';
      html += '<span class="slot ' + cls + '" style="--i:' + (i++) + '">' + esc(c === '_' ? '' : c.slice(1)) + '</span>';
    });
    html += '</div>';
  });
  return html;
}

function level(d, prev) {
  var same = screenIs('level') && levelKey === d.id;
  var typeChip = d.typeLabel ? '<span class="chip t-' + esc(d.type) + '">' + esc(d.typeLabel) + '</span>' : '';
  // A season pack's level: the pack's name and its place in the pack, like the tablet ("Level 13" of a 12-level pack
  // confused players). Older copies of the game don't send them: the world and its number show, as before.
  var where = d.pack || d.world, num = d.pack && d.packPos ? d.packPos : d.pos;
  setChips('<span class="chip">' + (picture(d.kind, d.pic) ? '<img alt="" src="' + esc(picture(d.kind, d.pic)) + '" onerror="noPic(this)">' : '') + esc(where) +
    '<span class="lab" style="margin:0 0 0 22px">Level</span><b>' + esc(num) + '</b></span>' + typeChip);
  if (!same) {
    levelKey = d.id;
    $('#view').innerHTML = '<div class="level" id="level"><section class="card t-' + esc(d.type) + '" id="card"><div class="side">' + emblem(d.kind, d.pic) +
      '<span class="kchip">' + esc(d.world) + '</span></div><div class="card-in"><ol class="clues" id="clues"></ol><div id="answer"></div></div></section>' +
      '<section class="play"><div class="slots" id="slots"></div><div id="below"></div></section></div>';
    prev = null;
  }
  var clues = d.clues || [];
  // Redrawn when the clues change, not just their number: the big clue takes the "still hidden" line's place (2 + 1
  // lines before, 3 after), when it's bought and when the level is solved.
  var cl = $('#clues'), ck = clues.join('\n') + (d.more ? '\n+' : '');
  if (cl.getAttribute('data-k') !== ck) {
    cl.setAttribute('data-k', ck);
    cl.innerHTML = clues.map(function (c, i) { return '<li class="clue" style="animation-delay:' + (i * 0.08) + 's">' + esc(c) + '</li>'; }).join('') +
      (d.more ? '<li class="clue more">Big clue still hidden</li>' : '');
  }
  var sl = $('#slots');
  sl.innerHTML = slotsHtml(d);
  // a wrong guess: the boxes flash red and shake
  if (prev && prev.id === d.id && (d.wrong | 0) > (prev.wrong | 0)) {
    sl.classList.remove('bad'); void sl.offsetWidth; sl.classList.add('bad');
    setTimeout(function () { sl.classList.remove('bad'); }, 650);
  }
  var card = $('#card'), burst = false;
  card.classList.toggle('won', !!d.solved);
  if (d.solved) {
    if (!prev || !prev.solved) {
      $('#answer').innerHTML = '<div class="answer">' + esc(d.answer) + '</div>';
      var stars = d.stars | 0;
      $('#below').innerHTML = '<div class="won-box"><div class="eyebrow">' + ['Solved!', 'Solved!', 'Great job!', 'Perfect!'][stars] + '</div><div class="bigstars">' +
        [1, 2, 3].map(function (n) { return IC.star.replace('<svg ', '<svg class="' + (n <= stars ? 'on' : '') + '" style="--d:' + (0.2 + n * 0.18) + 's" '); }).join('') + '</div></div>';
      burst = true;
    }
  } else {
    if ($('#answer').childElementCount) $('#answer').innerHTML = '';
    $('#below').innerHTML = '<div class="tray">' + (d.tray || []).map(function (k) {
      k = String(k);
      if (!k) return '<span class="key x"></span>';
      return k.charAt(0) === '-' ? '<span class="key u">' + esc(k.slice(1)) + '</span>' : '<span class="key">' + esc(k) + '</span>';
    }).join('') + '</div>';
  }
  fitLevel(d);
  if (burst) confetti(fitNow.x, fitNow.y, 160);
}

// ---------- fitting a level to the screen ----------
// The card, the boxes and the letters are one block. It's laid out at each of a few widths (a wide one makes clues
// take fewer lines and fits more letters a row; a narrow one leaves room to grow), and the width that lets the block
// grow the most wins; then the block is scaled to fill the room under the top bar (#view) and centred there. So a
// short level shows big, and three long clues with a long answer still fit, all in the same proportions.
var KEY_W = 90, K_MAX = 1.35, WIDTHS = [1776, 1600, 1440, 1320, 1200];
var fitNow = { id: '', key: '', w: 1776, k: 1, x: 960, y: 560 };
function fitLevel(d, force) {
  var lv = $('#level'), view = $('#view');
  if (!lv || !view) return;
  var words = d.words || [], keys = (d.tray || []).length, vw = view.clientWidth || 1776, vh = view.clientHeight || 854;
  // what changes the block's shape (not a letter going into a box)
  var key = [d.id, $('#clues').getAttribute('data-k'), d.solved ? 1 : 0, keys, words.map(function (w) { return w.length; }).join('.')].join('|');
  if (!force && key === fitNow.key) { layoutAt(lv, fitNow.w, words, keys, false); return; }
  var best = null;
  for (var i = 0; i < WIDTHS.length; i++) {
    var w = Math.min(WIDTHS[i], vw), k = Math.min(vw / w, vh / layoutAt(lv, w, words, keys, true), K_MAX);
    // a narrower width has to make the block clearly bigger, or a clue gets a line break (a word on its own) for nothing
    if (!best || k > best.k * 1.06) best = { w: w, k: k };
  }
  var h = layoutAt(lv, best.w, words, keys, true), tx = (vw - best.w * best.k) / 2, ty = (vh - h * best.k) / 2;
  lv.classList.toggle('anim', fitNow.id === d.id);   // the same level changing shape (the big clue, solved) glides
  lv.style.transform = 'translate(' + tx.toFixed(1) + 'px,' + ty.toFixed(1) + 'px) scale(' + best.k.toFixed(4) + ')';
  // the middle of the boxes on the stage, for the confetti (#view's place on the stage plus the block's own)
  var sl = $('#slots');
  fitNow = { id: d.id, key: key, w: best.w, k: best.k,
    x: view.offsetLeft + tx + (sl.offsetLeft + sl.offsetWidth / 2) * best.k, y: view.offsetTop + ty + (sl.offsetTop + sl.offsetHeight / 2) * best.k };
}
// Lays the block out at width w: the box size, and the letters in whole rows of about the same length. Returns its height.
function layoutAt(lv, w, words, keys, measure) {
  lv.style.width = w + 'px';
  $('#slots').style.setProperty('--s', boxSize(words, w) + 'px');
  var tray = $('#below .tray');
  if (tray) {
    var rows = Math.max(1, Math.ceil(keys / Math.max(1, Math.floor(w / KEY_W))));
    tray.style.width = Math.ceil(keys / rows) * KEY_W + 'px';
  }
  return measure ? lv.offsetHeight : 0;
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { if (shown === 'level' && S) fitLevel(S, true); });

function blitzChips(d) {
  setChips((d.bonus ? '<span class="chip gold">Bonus round</span>' : '<span class="chip">Blitz</span>') +
    '<span class="chip"><span class="lab">Score</span><b style="margin-left:0">' + (d.score | 0) + '</b></span>' +
    (d.bonus ? '<span class="chip">' + IC.gem.replace('<svg ', '<svg style="width:46px;height:46px;margin-right:10px" ') + '2 per point</span>' : ''));
}

function blitz(d) {
  var same = screenIs('blitz') && blitzBonus === !!d.bonus;
  blitzBonus = !!d.bonus;
  blitzChips(d);
  if (!same) {
    $('#view').innerHTML = '<div class="blitz' + (d.bonus ? ' bonusmode' : '') + '" id="blitz"><div class="timerrow"><div class="bar" id="bar"><i id="fill"></i></div><div class="secs" id="secs"></div></div>' +
      '<section class="qcard" id="qcard"></section><div class="opts" id="opts"></div></div>';
    blitzKey = '';
  }
  $('#blitz').classList.toggle('bonusmode', !!d.bonus);
  T.total = d.total || 60000; T.ms = d.ms || 0; T.paused = !!d.paused; T.endAt = performance.now() + (d.ms || 0);
  tick();
  // the question shows when the phone shows it: not during the 3-2-1
  var qkey = d.q && !d.count && (d.opts || []).length ? d.n + '|' + d.q : 'ready';
  if (qkey !== blitzKey) {
    blitzKey = qkey;
    $('#qcard').innerHTML = qkey !== 'ready' ? emblem(d.kind, d.pic) + '<p class="qtext">' + esc(d.q) + '</p>' :
      '<div class="eyebrow ready-tag">' + (d.bonus ? 'Bonus round!' : 'Get ready!') + '</div>';
  }
  // the 3-2-1 is drawn over the middle of the card, so "Get ready!" moves up out of its way
  $('#qcard').classList.toggle('counting', !!d.count);
  var opts = d.opts || [];
  $('#opts').innerHTML = opts.map(function (o, i) {
    var cls = i === d.right ? ' ok' : i === d.pick ? ' no' : '';
    return '<div class="opt' + cls + '">' + esc(o) + '</div>';
  }).join('');
  var old = $('#count');
  if (d.count) {
    if (!old || old.textContent !== d.count) {
      if (old) old.remove();
      $('#blitz').insertAdjacentHTML('beforeend', '<div class="count" id="count">' + esc(d.count) + '</div>');
    }
  } else if (old) old.remove();
}

// The Blitz clock runs here between the game's messages (it sends one a second and on every answer).
function tick() {
  var fill = $('#fill'), secs = $('#secs');
  if (!fill || shown !== 'blitz') return;
  var left = T.paused ? T.ms : Math.max(0, T.endAt - performance.now());
  fill.style.transform = 'scaleX(' + Math.max(0, Math.min(1, left / T.total)) + ')';
  var s = Math.ceil(left / 1000);
  secs.textContent = String(s);
  var low = left <= 10000 && !T.paused;
  $('#bar').classList.toggle('low', low); secs.classList.toggle('low', low);
}
(function loop() { tick(); requestAnimationFrame(loop); })();

function blitzEnd(d) {
  screenIs('blitzEnd');
  blitzChips(d);
  $('#view').innerHTML = '<div class="center"><div class="eyebrow">' + (d.bonus ? 'Bonus round' : "Time's up!") + '</div><p class="endscore">' + (d.score | 0) + '</p>' +
    (d.gems ? '<div class="gempill">+' + (d.gems | 0) + IC.gem + '</div>' : '') +
    '<p class="hint">' + (d.isBest ? '<b>New best score!</b>' : (d.correct | 0) + ' right answer' + ((d.correct | 0) === 1 ? '' : 's') + (d.bonus ? '' : ' · Best: ' + (d.best | 0))) + '</p></div>';
  if (d.gems || d.isBest) confetti(960, 420, 180);
}

var SYMS = ['gem', 'star', 'bolt', 'gift', 'flame', 'trophy'];
function bonusIntro(d) {
  screenIs('bonusIntro');
  setChips('<span class="chip gold">Surprise!</span>');
  var reels = [1, 3, 5].map(function (stop, r) {
    var html = '';
    for (var i = 0; i < 14; i++) html += '<div class="sym">' + IC[i === 13 ? 'bolt' : SYMS[(i * 5 + stop) % SYMS.length]] + '</div>';
    return '<div class="reel"><div class="strip" style="--n:13;--d:' + (r * 260) + 'ms">' + html + '</div></div>';
  }).join('');
  $('#view').innerHTML = '<div class="casino" id="casino"><div class="reels">' + reels + '</div><div class="btitle">Bonus<br>round</div>' +
    '<p class="ctext">' + (d.seconds | 0 || 30) + ' seconds of Blitz. Every right answer pays <b>' + (d.gemsPerPoint | 0 || 2) + ' gems</b>!</p></div>';
  setTimeout(function () {
    var c = $('#casino');
    if (!c || shown !== 'bonusIntro') return;
    c.classList.add('landed');
    $('#lights').classList.add('fast');
    confetti(960, 560, 200);
  }, 1560);
}

// ---------- confetti, drawn on the stage ----------
var COLORS = ['#f7c63d', '#17b86a', '#f0484e', '#f6f2e6', '#ffe28a', '#5dcd97'];
var parts = [], raf = 0;
function confetti(x, y, n) {
  for (var i = 0; i < n; i++) {
    var a = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.3, v = 14 + Math.random() * 20;
    parts.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.35, w: 12 + Math.random() * 12, h: 18 + Math.random() * 16, c: COLORS[i % COLORS.length], age: 0, life: 90 + Math.random() * 60 });
  }
  if (!raf) raf = requestAnimationFrame(step);
}
function step() {
  var g = $('#fx').getContext('2d');
  g.clearRect(0, 0, 1920, 1080);
  parts = parts.filter(function (p) { return p.age < p.life && p.y < 1140; });
  parts.forEach(function (p) {
    p.age++; p.vx *= 0.985; p.vy = p.vy * 0.985 + 0.7; p.x += p.vx; p.y += p.vy; p.r += p.vr;
    g.save(); g.globalAlpha = Math.max(0, Math.min(1, (p.life - p.age) / 20)); g.translate(p.x, p.y); g.rotate(p.r); g.scale(1, Math.cos(p.age * 0.22));
    g.fillStyle = p.c; g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); g.restore();
  });
  raf = parts.length ? requestAnimationFrame(step) : 0;
  if (!raf) g.clearRect(0, 0, 1920, 1080);
}

// ---------- where the game's messages come from ----------
// a browser window opened by the game ("Open TV screen")
var bc = null;
try {
  bc = new BroadcastChannel('jamdungquiz-tv');
  bc.onmessage = function (e) { if (typeof e.data === 'string' && e.data.charAt(0) === '{') take(e.data); };
  bc.postMessage('hello');
  setInterval(function () { bc.postMessage('alive'); }, 5000);
  addEventListener('pagehide', function () { bc.postMessage('bye'); });
} catch (e) { /* no BroadcastChannel: the app calls tvState() itself */ }
// Chromecast / Google TV: this page is the Cast receiver (registered with ?cast=1 on the end)
var CAST_NS = 'urn:x-cast:com.realisticworks.jamdungquiz';
if (/[?&]cast=1/.test(location.search)) {
  var cs = document.createElement('script');
  cs.src = 'https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js';
  cs.onload = function () {
    try {
      var ctx = cast.framework.CastReceiverContext.getInstance(), sys = cast.framework.system;
      ctx.addCustomMessageListener(CAST_NS, function (e) { take(e.data); });
      var o = new cast.framework.CastReceiverOptions();
      o.skipPlayersLoad = true; o.disableIdleTimeout = true; o.statusText = 'Jamdung Quiz'; o.customNamespaces = {}; o.customNamespaces[CAST_NS] = sys.MessageType.JSON;
      // close when the phone stops casting (not when it just loses Wi-Fi for a moment)
      ctx.addEventListener(sys.EventType.SENDER_DISCONNECTED, function (e) { if (!ctx.getSenders().length && e.reason === sys.DisconnectReason.REQUESTED_BY_SENDER) ctx.stop(); });
      ctx.start(o);
    } catch (e) { console.warn('Jamdung Quiz TV: the Cast receiver did not start', e); }
  };
  document.head.appendChild(cs);
}
waiting();
</script>
